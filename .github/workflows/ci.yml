name: CI

on:
  push:
  pull_request:

# Un push nuevo cancela la ejecución anterior de la misma rama o PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Solo lectura: este workflow no publica nada.
permissions:
  contents: read

jobs:
  checks:
    name: Tipos, lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint y Prettier
        run: npm run lint

      - name: Pruebas con cobertura del dominio
        run: npm run test:coverage -- --ci

      - name: Pantalla de desarrollo fuera del bundle de producción
        run: npm run check:bundle

  database:
    name: Base de datos y RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Versión fija: la misma CLI que creó supabase/ (npx supabase@2.120.0).
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      # Solo Postgres, con las migraciones de supabase/migrations aplicadas en orden.
      - name: Postgres local con las migraciones
        run: supabase db start

      # pgTAP de supabase/tests/database: estructura, RLS por tabla, suplantación, integridad
      # y perfiles.
      - name: Pruebas de seguridad de la base
        run: supabase test db

      # Dos conexiones a la vez contra ese mismo Postgres: el último uso de un enlace de invitación
      # lo gana exactamente una cuenta. Corre después de pgTAP porque deja cuentas y grupos de prueba.
      # Solo necesita `pg`; no hay que compilar nada de la app.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Concurrencia de las invitaciones
        run: npm run test:concurrencia
